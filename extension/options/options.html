<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI求职Agent - 设置</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <h1>AI求职Agent 插件设置</h1>

    <div class="card">
      <h2>API 地址</h2>
      <p class="desc">AI求职Agent后端服务地址</p>
      <input type="text" id="api-url" placeholder="http://localhost:3000">
    </div>

    <div class="card">
      <h2>API Key</h2>
      <p class="desc">在AI求职Agent网页端的"设置"页面中生成并复制API Key</p>
      <input type="password" id="api-key" placeholder="粘贴API Key">
      <div class="btn-row">
        <button id="show-key-btn" class="secondary-btn">显示</button>
        <button id="test-btn" class="secondary-btn">测试连接</button>
      </div>
      <p id="test-result" class="result"></p>
    </div>

    <div class="card">
      <h2>安装步骤</h2>
      <ol>
        <li>确保AI求职Agent后端已启动（<code>npm run dev</code>）</li>
        <li>打开AI求职Agent网页端 → 设置 → 浏览器插件 → 点击"生成API Key"</li>
        <li>复制生成的API Key并粘贴到上方的输入框中</li>
        <li>点击"保存"，然后点击"测试连接"确认连通</li>
        <li>浏览Boss直聘/LinkedIn/拉勾/智联/小红书 → 点击页面右下角浮窗按钮采集岗位</li>
      </ol>
    </div>

    <div class="actions">
      <button id="save-btn" class="primary-btn">保存设置</button>
    </div>
    <p id="save-result" class="result"></p>
  </div>

  <script src="options.js"></script>
</body>
</html>
